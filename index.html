<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой Хаб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #f4f4f4);
            color: var(--tg-theme-text-color, #000000);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #888888);
            margin-bottom: 30px;
        }
        /* Делаем сетку 2 на 2 */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 10px;
        }
        /* Стили квадратных кнопок */
        .game-btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 16px;
            padding: 25px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* Тень для объема */
            box-shadow: 0 6px 0 rgba(0,0,0,0.2); 
            transition: transform 0.1s, box-shadow 0.1s;
        }
        /* Эффект физического нажатия */
        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent;
        }
        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🕹️ Игровой хаб</h1>
    <p>Выбери игру и попробуй побить рекорд админа!</p>

    <div class="games-grid">
        <div class="game-btn" onclick="alert('Скоро тут будет Тетрис!')">
            <span class="icon">🧩</span>
            <span class="title">Тетрис</span>
        </div>
        <div class="game-btn" onclick="alert('Скоро тут будет Сапер!')">
            <span class="icon">💣</span>
            <span class="title">Сапер</span>
        </div>
        <div class="game-btn" onclick="alert('Скоро тут будет Судоку!')">
            <span class="icon">🔢</span>
            <span class="title">Судоку</span>
        </div>
        <div class="game-btn" onclick="alert('Скоро тут будет Змейка!')">
            <span class="icon">🐍</span>
            <span class="title">Змейка</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready();  
    </script>
</body>
</html>
