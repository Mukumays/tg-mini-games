<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тетрис</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #111111);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 5px;
            overflow: hidden;
            touch-action: none; 
        }
        
        /* Главный контейнер, где всё стоит в ряд */
        .game-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 10px;
            width: 100%;
            max-width: 380px;
        }

        /* Боковые панели */
        .side-panel {
            display: flex;
            flex-direction: column;
            width: 75px; /* Ширина боковых окон */
        }
        .left-panel {
            justify-content: space-between; /* HOLD сверху, статы снизу */
        }
        .right-panel {
            justify-content: flex-start; /* NEXT сверху */
        }

        /* Оформление блоков (HOLD, NEXT, СТАТИСТИКА) */
        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title-text {
            font-size: 11px;
            font-weight: bold;
            color: var(--tg-theme-hint-color, #888888);
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-align: center;
        }
        .canvas-box {
            background-color: #222222;
            border: 2px solid #444444;
            border-radius: 6px;
        }
        
        /* Панель статистики слева внизу */
        .stats-panel {
            background-color: #222222;
            border: 2px solid #444444;
            border-radius: 6px;
            padding: 8px 0;
            text-align: center;
            margin-bottom: 2px; /* Выравнивание по нижнему краю поля */
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
            margin-bottom: 8px;
        }
        .stat-value:last-child {
            margin-bottom: 0;
        }

        /* Главное игровое поле */
        canvas#gameCanvas {
            background-color: #000000;
            border: 2px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(51, 144, 236, 0.2);
            /* Строго 10x20 клеток (если клетка 20px, то размер 200x400) */
        }

        .back-btn {
            margin-top: 20px;
            color: var(--tg-theme-hint-color, #888888);
            background: none;
            border: none;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="side-panel left-panel">
            <div class="box" id="hold-btn" style="cursor: pointer;">
                <div class="title-text">HOLD</div>
                <canvas id="holdCanvas" class="canvas-box" width="70" height="70"></canvas>
            </div>
            
            <div class="stats-panel">
                <div class="title-text">SCORE</div>
                <div id="score" class="stat-value">0</div>
                
                <div class="title-text">LEVEL</div>
                <div id="level" class="stat-value">1</div>
                
                <div class="title-text">LINES</div>
                <div id="lines" class="stat-value">0</div>
            </div>
        </div>

        <!-- ЦЕНТР (ИГРОВОЕ ПОЛЕ) -->
        <div class="center-panel">
            <canvas id="gameCanvas" width="200" height="400"></canvas>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="side-panel right-panel">
            <div class="box">
                <div class="title-text">NEXT</div>
                <!-- Высота 210px, чтобы влезли 3 фигуры -->
                <canvas id="nextCanvas" class="canvas-box" width="70" height="210"></canvas>
            </div>
        </div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">Вернуться в меню</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        function moveLeft() { console.log('Влево'); }
        function moveRight() { console.log('Вправо'); }
        function moveDown() { console.log('Вниз (плавно)'); }
        function hardDrop() { console.log('Резко вниз!'); }
        function rotate() { console.log('Поворот'); }
        function hold() { alert('Фигура отправлена в HOLD!'); }

        document.addEventListener('keydown', function(event) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(event.code) > -1) {
                event.preventDefault();
            }
            let key = event.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a') moveLeft();
            if (key === 'arrowright' || key === 'd') moveRight();
            if (key === 'arrowdown' || key === 's') moveDown();
            if (key === 'arrowup' || key === 'w' || key === 'z') rotate();
            if (event.code === 'Space') hardDrop();
            if (key === 'c') hold();
        });

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', function(event) {
            if (event.target.tagName.toLowerCase() === 'button' || event.target.closest('#hold-btn')) return;

            let touchEndX = event.changedTouches[0].screenX;
            let touchEndY = event.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
                rotate();
                return;
            }

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight(); 
                else if (dx < -30) moveLeft(); 
            } else {
                if (dy > 30) hardDrop(); 
            }
        }, false);

        document.getElementById('hold-btn').addEventListener('click', hold);
    </script>
</body>
</html>
