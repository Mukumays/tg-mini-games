<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тетрис</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #111111);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            /* Главные изменения для центрирования: */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            overflow: hidden;
            touch-action: none; 
            box-sizing: border-box;
        }
        
        .game-wrapper {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 8px; 
            width: 100%;
            max-width: 400px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            width: 55px; 
        }
        .left-panel {
            justify-content: space-between;
        }
        .right-panel {
            justify-content: flex-start;
        }

        .box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title-text {
            font-size: 10px;
            font-weight: bold;
            color: var(--tg-theme-hint-color, #888888);
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-align: center;
        }
        .canvas-box {
            background-color: #222222;
            border: 2px solid #444444;
            border-radius: 6px;
        }
        
        .stats-panel {
            background-color: #222222;
            border: 2px solid #444444;
            border-radius: 6px;
            padding: 8px 0;
            text-align: center;
            margin-bottom: 2px;
        }
        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
            margin-bottom: 8px;
        }
        .stat-value:last-child {
            margin-bottom: 0;
        }

        canvas#gameCanvas {
            background-color: #000000;
            border: 2px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(51, 144, 236, 0.2);
        }

        .back-btn {
            margin-top: 25px;
            color: var(--tg-theme-hint-color, #888888);
            background: none;
            border: none;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="side-panel left-panel">
            <div class="box" id="hold-btn" style="cursor: pointer;">
                <div class="title-text">HOLD</div>
                <canvas id="holdCanvas" class="canvas-box" width="50" height="50"></canvas>
            </div>
            
            <div class="stats-panel">
                <div class="title-text">SCORE</div>
                <div id="score" class="stat-value">0</div>
                
                <div class="title-text">LEVEL</div>
                <div id="level" class="stat-value">1</div>
                
                <div class="title-text">LINES</div>
                <div id="lines" class="stat-value">0</div>
            </div>
        </div>

        <!-- ЦЕНТР (ИГРОВОЕ ПОЛЕ) -->
        <div class="center-panel">
            <canvas id="gameCanvas" width="240" height="480"></canvas>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="side-panel right-panel">
            <div class="box">
                <div class="title-text">NEXT</div>
                <canvas id="nextCanvas" class="canvas-box" width="50" height="150"></canvas>
            </div>
        </div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">Вернуться в меню</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // --- НАСТРОЙКА ИГРОВОГО ПОЛЯ ---
        const canvas = document.getElementById('gameCanvas');
        const context = canvas.getContext('2d');
        context.scale(24, 24); 

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }
        const arena = createMatrix(10, 20);

        const colors = [
            null,
            '#FF0D72', // 1 - T
            '#0DC2FF', // 2 - I
            '#0DFF72', // 3 - S
            '#F538FF', // 4 - Z
            '#FF8E0D', // 5 - L
            '#FFE138', // 6 - J
            '#3877FF'  // 7 - O
        ];

        function createPiece(type) {
            if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            // Чуть позже добавим сюда остальные фигуры
        }

        const player = {
            pos: {x: 3, y: 0},
            matrix: createPiece('T'),
        };

        // --- НОВОЕ: ФИЗИКА И СТОЛКНОВЕНИЯ ---
        
        // Функция проверяет, врезались ли мы во что-то
        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Функция "приклеивает" упавшую фигуру к полю
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        // Возвращаем фигуру наверх (пока просто создаем новую Т-фигуру)
        function playerReset() {
            player.matrix = createPiece('T');
            player.pos.y = 0;
            player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
        }

        // --- ОТРИСОВКА ---
        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.lineWidth = 0.05;
                        context.strokeStyle = 'black';
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        // --- УПРАВЛЕНИЕ С УЧЕТОМ СТЕН ---
        function moveLeft() { 
            player.pos.x--; 
            if (collide(arena, player)) player.pos.x++; // Если стена - отменяем шаг
        }
        function moveRight() { 
            player.pos.x++; 
            if (collide(arena, player)) player.pos.x--; // Если стена - отменяем шаг
        }
        function moveDown() { 
            player.pos.y++; 
            if (collide(arena, player)) {
                player.pos.y--; // Поднимаем на пиксель вверх (чтобы не застряла в полу)
                merge(arena, player); // Замораживаем
                playerReset(); // Бросаем новую
            }
            dropCounter = 0; 
        }
        
        function hardDrop() { console.log('Резко вниз!'); }
        function rotate() { console.log('Поворот'); }
        function hold() { alert('Фигура отправлена в HOLD!'); }

        // --- ИГРОВОЙ ЦИКЛ (ГРАВИТАЦИЯ) ---
        let dropCounter = 0;
        let dropInterval = 1000; 
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                moveDown(); // Теперь используем нашу умную функцию с проверкой пола
            }

            draw();
            requestAnimationFrame(update);
        }

        // Слушатели клавиатуры и свайпов оставляем как были
        document.addEventListener('keydown', function(event) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(event.code) > -1) {
                event.preventDefault();
            }
            let key = event.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a') moveLeft();
            if (key === 'arrowright' || key === 'd') moveRight();
            if (key === 'arrowdown' || key === 's') moveDown();
            if (key === 'arrowup' || key === 'w' || key === 'z') rotate();
            if (event.code === 'Space') hardDrop();
            if (key === 'c') hold();
        });

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', function(event) {
            if (event.target.tagName.toLowerCase() === 'button' || event.target.closest('#hold-btn')) return;

            let touchEndX = event.changedTouches[0].screenX;
            let touchEndY = event.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
                rotate();
                return;
            }

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight(); 
                else if (dx < -30) moveLeft(); 
            } else {
                if (dy > 30) hardDrop(); 
            }
        }, false);

        document.getElementById('hold-btn').addEventListener('click', hold);

        // СТАРТ ИГРЫ!
        update();
    </script>
</body>
</html>
