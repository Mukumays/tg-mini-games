<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тетрис</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #111111);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow: hidden;
            touch-action: none; 
        }
        /* Новая панель: 3 элемента в ряд */
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            max-width: 260px; /* Слегка расширили для 3 блоков */
            margin-bottom: 15px;
        }
        .side-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #hold-btn {
            cursor: pointer;
        }
        .center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 5px;
        }
        .title-text {
            font-size: 12px;
            font-weight: bold;
            color: var(--tg-theme-hint-color, #888888);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        #holdCanvas, #nextCanvas {
            background-color: #222222;
            border: 2px solid #444444;
            border-radius: 6px;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #3390ec);
        }
        canvas#gameCanvas {
            background-color: #000000;
            border: 2px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(51, 144, 236, 0.2);
        }
        .back-btn {
            margin-top: 25px;
            color: var(--tg-theme-hint-color, #888888);
            background: none;
            border: none;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-panel">
        <!-- Блок HOLD (слева) -->
        <div class="side-box" id="hold-btn">
            <div class="title-text">HOLD</div>
            <canvas id="holdCanvas" width="60" height="60"></canvas>
        </div>
        
        <!-- Блок СЧЕТ (по центру) -->
        <div class="center-box">
            <div class="title-text">СЧЕТ</div>
            <div id="score">0</div>
        </div>

        <!-- Блок NEXT (справа) -->
        <div class="side-box">
            <div class="title-text">NEXT</div>
            <canvas id="nextCanvas" width="60" height="60"></canvas>
        </div>
    </div>

    <!-- Главное игровое поле -->
    <canvas id="gameCanvas" width="200" height="400"></canvas>

    <button class="back-btn" onclick="window.location.href='index.html'">Вернуться в меню</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        function moveLeft() { console.log('Влево'); }
        function moveRight() { console.log('Вправо'); }
        function moveDown() { console.log('Вниз (плавно)'); }
        function hardDrop() { console.log('Резко вниз!'); }
        function rotate() { console.log('Поворот'); }
        function hold() { alert('Фигура отправлена в HOLD!'); }

        document.addEventListener('keydown', function(event) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(event.code) > -1) {
                event.preventDefault();
            }
            let key = event.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a') moveLeft();
            if (key === 'arrowright' || key === 'd') moveRight();
            if (key === 'arrowdown' || key === 's') moveDown();
            if (key === 'arrowup' || key === 'w' || key === 'z') rotate();
            if (event.code === 'Space') hardDrop();
            if (key === 'c') hold();
        });

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        document.addEventListener('touchend', function(event) {
            if (event.target.tagName.toLowerCase() === 'button' || event.target.closest('#hold-btn')) return;

            let touchEndX = event.changedTouches[0].screenX;
            let touchEndY = event.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
                rotate();
                return;
            }

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight(); 
                else if (dx < -30) moveLeft(); 
            } else {
                if (dy > 30) hardDrop(); 
            }
        }, false);

        document.getElementById('hold-btn').addEventListener('click', hold);
    </script>
</body>
</html>
